on: [push]

jobs:
  test-nix-setup:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # The flake's `mac` host is x86_64-darwin, so it needs the Intel
        # macOS runner image; `macos-latest` is Apple Silicon.
        os: ["ubuntu-latest", "macos-15-intel"]
    steps:
      - uses: actions/checkout@v5
      - run: ./nix-setup.sh

  test-nix-setup-on-fedora:
    name: test-setup (${{ matrix.distro }})
    runs-on: "ubuntu-latest"
    timeout-minutes: 40
    container:
      image: ${{ matrix.distro }}
    strategy:
      fail-fast: false
      matrix:
        distro: ["fedora:latest", "fedora:44"]
    steps:
      - uses: actions/checkout@v5
      - run: ./nix-setup.sh
